name: CI devops 2025
on:
  # Se déclenche sur les push vers main et develop
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Récupère le code du dépôt dans le runner
      # fetch-depth: 0 = historique complet, recommandé par Sonar pour son analyse
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installe le JDK 21 avec l'action setup-java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Compile et lance les tests unitaires + d'intégration (Testcontainers)
      - name: Build and test with Maven
        run: mvn clean verify --file simple-api/pom.xml

      # Analyse de qualité du code avec SonarCloud (quality gate)
      # projectKey = clé du PROJET (pas de l'organisation), organization = marko075
      - name: SonarCloud analysis
        run: mvn -B -e verify sonar:sonar -Dsonar.projectKey=marko075_tp-devops-correction-docker -Dsonar.organization=marko075 -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} --file ./simple-api/pom.xml

  build-and-push-docker-image:
    # Ne démarre que si test-backend est passé
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      # Récupère le code du dépôt dans le runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Connexion à Docker Hub avec les secrets GitHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Image de l'API (dossier simple-api)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # dossier qui contient le Dockerfile de l'API
          context: ./simple-api
          # les tags doivent être en minuscules
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          # build sur toutes les branches, push seulement sur main
          push: ${{ github.ref == 'refs/heads/main' }}

      # Image de la base de données (dossier database)
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # Image du serveur HTTP (dossier http-server)
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}

  deploy:
    name: Deploy with Ansible
    needs: build-and-push-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible and Docker collection
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure Ansible Vault
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s\n' "$VAULT_PASSWORD" > ~/.vault_password
          chmod 600 ~/.vault_password

      - name: Deploy application
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ansible-playbook \
            -i ansible/inventories/setup.yml \
            ansible/playbook.yml \
            --vault-password-file ~/.vault_password \
            -e "ansible_user=$SSH_USER" \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa"