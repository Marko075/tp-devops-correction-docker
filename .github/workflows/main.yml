
name: CI devops 2025

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # 1. Tests et analyse du backend
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: mvn clean verify --file simple-api/pom.xml

      - name: SonarCloud analysis
        run: >
          mvn -B -e verify sonar:sonar
          -Dsonar.projectKey=marko075_tp-devops-correction-docker
          -Dsonar.organization=marko075
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          --file ./simple-api/pom.xml

  # 2. Construction et publication des images Docker
  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

      - name: Build and push Apache
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest

      - name: Build and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest

  # 3. Déploiement avec Ansible
  deploy:
    name: Deploy with Ansible
    needs: build-and-push-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and Docker collection
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ansible openssh-client
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY is empty"; exit 1; }
          test -n "$SSH_HOST" || { echo "::error::SSH_HOST is empty"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::SSH_USER is empty"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -vv \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_rsa \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection successful'"

      - name: Configure Ansible Vault
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VAULT_PASSWORD" || { echo "::error::ANSIBLE_VAULT_PASSWORD is empty"; exit 1; }
          printf '%s\n' "$VAULT_PASSWORD" > ~/.vault_password
          chmod 600 ~/.vault_password

      - name: Check Ansible connectivity
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ansible \
            -i ansible/inventories/setup.yml \
            all \
            -m ping \
            -e "ansible_user=$SSH_USER" \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa" \
            -vvv

      - name: Deploy application
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ansible-playbook \
            -i ansible/inventories/setup.yml \
            ansible/playbook.yml \
            --vault-password-file ~/.vault_password \
            -e "ansible_user=$SSH_USER" \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa" \
            -vvv
