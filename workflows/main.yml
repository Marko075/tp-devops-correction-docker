
name: CI devops 2025

on:
  # Déclenchement sur les push vers main et develop
  push:
    branches: [main, develop]

  # Déclenchement sur les pull requests
  pull_request:

jobs:
  # 1. Tests et analyse du backend
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: mvn clean verify --file simple-api/pom.xml

      - name: SonarCloud analysis
        run: >
          mvn -B -e verify sonar:sonar
          -Dsonar.projectKey=marko075_tp-devops-correction-docker
          -Dsonar.organization=marko075
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          --file ./simple-api/pom.xml

  # 2. Construction et publication des images Docker
  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Image du backend
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      # Image de la base de données
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

      # Image du serveur Apache
      - name: Build and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest

      # Image du front
      - name: Build and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest

  # 3. Déploiement sur le serveur avec Ansible
  deploy:
    name: Deploy with Ansible
    needs: build-and-push-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and Docker collection
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure Ansible Vault
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s\n' "$VAULT_PASSWORD" > ~/.vault_password
          chmod 600 ~/.vault_password

      - name: Deploy application
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ansible-playbook \
            -i ansible/inventories/setup.yml \
            ansible/playbook.yml \
            --vault-password-file ~/.vault_password \
            -e "ansible_user=$SSH_USER" \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa"
